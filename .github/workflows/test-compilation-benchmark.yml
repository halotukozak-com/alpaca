name: Test Compilation Benchmark

# Runs on every pull request so that it can be a required check: a PR that does not touch the library or the build
# reports success without measuring (see the `changes` step), instead of never reporting and blocking the merge.
on:
  pull_request:

jobs:
  benchmark:
    name: Compilation Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check for library or build changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
               --jq '.[].filename' | grep -qE '^(src/|build\.mill$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No changes under src/ or to build.mill; skipping the benchmark."
          fi

      - name: Checkout PR Branch
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: current

      - name: Checkout Base Branch
        if: steps.changes.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Set up JDK
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Mill dependencies
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('current/build.mill') }}
          restore-keys: |
            ${{ runner.os }}-mill-

      - name: Install Hyperfine
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      # `jvm.test.compile` alone routinely takes 9-15 minutes on this repo (macro-heavy
      # grammars like ScalaParser under test/), so `--runs 5` (the previous setting) meant
      # 2 variants x 5 runs x a full clean rebuild each = 2+ hours per PR, most of it
      # re-measuring a workload dominated by macro expansion, not noise. On a dedicated,
      # single-tenant GitHub Actions runner a single clean measurement is already far less
      # noisy than that repeated sampling was buying us. Scoped to the `jvm` platform only
      # (native.test.compile would double the cost for a build shape we're not tracking here).
      - name: Run Benchmarks
        if: steps.changes.outputs.run == 'true'
        id: benchmark
        run: |
          set -e

          run_bench() {
            local dir=$1
            echo "::group::Benchmarking $dir"
            (
              cd "$dir"

              hyperfine --runs 5 --show-output \
                --prepare "./mill clean && ./mill jvm.compile" \
                "./mill jvm.test.compile" \
                --export-json "../${dir}.json"
            )
            echo "::endgroup::"
          }

          run_bench "base"
          run_bench "current"

      - name: Extract Results
        if: steps.changes.outputs.run == 'true'
        id: extract
        run: |
          echo "base_mean=$(jq '.results[0].mean' base.json)" >> $GITHUB_OUTPUT
          echo "curr_mean=$(jq '.results[0].mean' current.json)" >> $GITHUB_OUTPUT

      # Fork-triggered `pull_request` runs always get a read-only GITHUB_TOKEN,
      # regardless of the `permissions:` block above, so this job can't post a PR
      # comment directly (see https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/).
      # Instead it hands the numbers off as an artifact; comment-compilation-benchmark.yml
      # (triggered by workflow_run, running with the base repo's token) posts the comment.
      - name: Save Benchmark Result
        if: steps.changes.outputs.run == 'true'
        env:
          BASE_MEAN: ${{ steps.extract.outputs.base_mean }}
          CURR_MEAN: ${{ steps.extract.outputs.curr_mean }}
        run: |
          jq -n \
            --arg pr_number "${{ github.event.pull_request.number }}" \
            --arg base_ref "${{ github.event.pull_request.base.ref }}" \
            --arg head_ref "${{ github.event.pull_request.head.ref }}" \
            --arg base_mean "$BASE_MEAN" \
            --arg curr_mean "$CURR_MEAN" \
            '{pr_number: ($pr_number | tonumber), base_ref: $base_ref, head_ref: $head_ref, base_mean: ($base_mean | tonumber), curr_mean: ($curr_mean | tonumber)}' \
            > benchmark-result.json

      - name: Upload Benchmark Result
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: compilation-benchmark-result
          path: benchmark-result.json
          retention-days: 1

      - name: Fail on Significant Regression
        if: steps.changes.outputs.run == 'true'
        env:
          BASE_MEAN: ${{ steps.extract.outputs.base_mean }}
          CURR_MEAN: ${{ steps.extract.outputs.curr_mean }}
        run: |
          awk -v base="$BASE_MEAN" -v curr="$CURR_MEAN" 'BEGIN {
            pct = (curr - base) / base * 100
            printf "Base: %.3fs, Current: %.3fs, Delta: %.2f%%\n", base, curr, pct
            if (pct > 15) {
              printf "::error::Compilation time regressed by %.2f%% (> 15%% threshold)\n", pct
              exit 1
            }
          }'
